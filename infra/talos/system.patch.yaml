# The system pool: the dispatcher, the git service and everything else
# privileged. Untainted, so anything not pinned elsewhere lands here.
#
# The label is Talos's own field rather than a kubelet registration argument,
# because a registration argument is read once, when the node first joins: Talos
# reconciles this one, so a change to it reaches a node that is already running.
# Taints have no registration argument that survives at all, and the two belong
# in the same place.
machine:
  nodeLabels:
    chuggy.io/pool: system
