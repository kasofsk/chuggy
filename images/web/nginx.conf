# The whole of the web image's nginx configuration. Every path nginx writes is
# under /tmp, and there is no `user` directive, because the master process is
# the image's unprivileged user and cannot set another.

worker_processes  1;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
	worker_connections  256;
}

http {
	include       mime.types;
	default_type  application/octet-stream;
	access_log    /dev/stdout;

	client_body_temp_path  /tmp/client-body;
	proxy_temp_path        /tmp/proxy;
	fastcgi_temp_path      /tmp/fastcgi;
	uwsgi_temp_path        /tmp/uwsgi;
	scgi_temp_path         /tmp/scgi;

	sendfile       on;
	server_tokens  off;

	server {
		listen  8080;
		root    /usr/share/nginx/html;
		index   index.html;

		# WHY THESE ARE THE IMAGE'S AND NOT AN INGRESS'S. They describe the
		# document, so they belong to whatever serves it: a console deployed
		# somewhere that forgot to add them is unsafe in the same ways, and an
		# edge rule protects one installation rather than the artifact. The
		# deployment this was written for puts the API on the same hostname
		# behind one Ingress, where the ingress-level alternative stamps these
		# onto the API's JSON as well -- checked, not assumed -- or splits the
		# origin the console cannot be split from.
		#
		# `no-referrer` IS THE LOAD-BEARING ONE. The sign-in returns to
		# /auth/callback with the authorization code in the query string, and
		# under any weaker policy that URL travels in the Referer header of
		# every subsequent request the page makes. The code is single-use and
		# PKCE-bound, so this is a narrow window rather than a standing key --
		# and it is a window nothing else here closes.
		#
		# `frame-ancestors 'none'` is the other: this console submits, cancels
		# and revises operations, and nothing in front of it asks who is
		# framing it.
		#
		# THE POLICY IS `default-src 'none'` AND THEN WHAT THE CONSOLE ACTUALLY
		# LOADS -- its own module graph and one stylesheet, plus the `data:`
		# favicon in index.html. It parses no HTML from strings, writes no
		# style attribute and posts no form, so nothing here needs
		# 'unsafe-inline' and `form-action 'none'` costs it nothing.
		#
		# `connect-src` IS THE ONE THAT CANNOT BE TIGHTER HERE. The console
		# reads its issuer from /config.json at start-up, so the origin it
		# fetches discovery and tokens from is a deployment's value and not the
		# image's -- naming one would be this image serving exactly one
		# installation. `https:` still refuses http:, ws: and data:
		# destinations; a deployment that wants its issuer pinned sets its own
		# header at the edge, and that one may name it.
		add_header  content-security-policy  "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header  referrer-policy          "no-referrer" always;
		add_header  x-content-type-options   "nosniff" always;
		# Redundant beside `frame-ancestors` for anything current, and kept for
		# what does not implement it.
		add_header  x-frame-options          "DENY" always;

		# Answers whether or not the document root has anything in it, so a
		# probe reports the server rather than the site.
		location = /healthz {
			access_log    off;
			default_type  text/plain;
			return        200 "ok\n";
		}

		# The deployment's own file, from outside the document root, so a copy
		# of it inside the site is unreachable rather than merely overridden.
		# Absent, this is a 404 and not the index below: a UI handed its own
		# markup where its configuration should be cannot tell what went wrong.
		# THE SECURITY HEADERS ARE REPEATED BECAUSE nginx DOES NOT MERGE THEM.
		# `add_header` is inherited from the enclosing level only while the
		# current level declares none of its own, so the `cache-control` below
		# would silently drop every header set on the server -- leaving the one
		# response that names the issuer and the client as the only one served
		# without them.
		location = /config.json {
			alias       /etc/chuggy/web/config.json;
			add_header  cache-control            "no-store" always;
			add_header  content-security-policy  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
			add_header  referrer-policy          "no-referrer" always;
			add_header  x-content-type-options   "nosniff" always;
			add_header  x-frame-options          "DENY" always;
		}

		# Every unresolved path is the index, because the routes belong to the
		# client: the OAuth redirect the sign-in returns to is not a file, and a
		# 404 there ends the flow.
		location / {
			try_files  $uri $uri/ /index.html;
		}
	}
}
