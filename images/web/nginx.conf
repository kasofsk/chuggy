# The whole of the web image's nginx configuration. Every path nginx writes is
# under /tmp, and there is no `user` directive, because the master process is
# the image's unprivileged user and cannot set another.

worker_processes  1;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
	worker_connections  256;
}

http {
	include       mime.types;
	default_type  application/octet-stream;
	access_log    /dev/stdout;

	client_body_temp_path  /tmp/client-body;
	proxy_temp_path        /tmp/proxy;
	fastcgi_temp_path      /tmp/fastcgi;
	uwsgi_temp_path        /tmp/uwsgi;
	scgi_temp_path         /tmp/scgi;

	sendfile       on;
	server_tokens  off;

	server {
		listen  8080;
		root    /usr/share/nginx/html;
		index   index.html;

		# Answers whether or not the document root has anything in it, so a
		# probe reports the server rather than the site.
		location = /healthz {
			access_log    off;
			default_type  text/plain;
			return        200 "ok\n";
		}

		location / {
			try_files  $uri $uri/ =404;
		}
	}
}
