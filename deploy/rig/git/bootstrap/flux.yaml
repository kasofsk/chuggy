apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: rig
  namespace: chuggy-git
spec:
  interval: 1m
  timeout: 60s
  ref:
    branch: main
  # In-cluster, so the sync read never leaves the pod network and never
  # traverses the ingress that the operator push does.
  url: http://git.chuggy-git.svc.cluster.local./rig.git
  secretRef:
    name: git-sync
---
# Without a serviceAccountName the kustomize-controller reconciles as its own
# identity, which is bound to cluster-admin: a push to the default branch would
# apply as cluster-admin over the whole cluster. This account reaches only the
# objects ./deploy carries, so the operator token is worth exactly that
# reconciliation and not the configuration that authorizes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rig-reconciler
  namespace: chuggy-git
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rig-reconciler
  namespace: chuggy-git
rules:
  # Named for what ./deploy applies. Anything that can overwrite or remove a
  # live object is scoped to those names, because the namespace also holds
  # git-http — the nginx configuration the write wall is made of — and a
  # type-scoped rule here would let a push to the default branch rewrite it.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [rig-state]
    verbs: [get, update, patch, delete]
  # Server-side apply authorizes a missing object as create as well as patch,
  # and RBAC cannot scope create by name. It is the one verb that stays
  # namespace-wide, and its bound is a live object rather than a name: the API
  # server rejects a create on an existing name before any write, so what stays
  # in reach is a name nothing currently holds. This account carries no pod or
  # deployment verb, so it cannot make such a creation take effect. The delete
  # above is what prune spends, so prune reaches rig-state and nothing else.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rig-reconciler
  namespace: chuggy-git
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rig-reconciler
subjects:
  - kind: ServiceAccount
    name: rig-reconciler
    namespace: chuggy-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rig
  namespace: chuggy-git
spec:
  interval: 1m
  timeout: 2m
  path: ./deploy
  prune: true
  wait: true
  serviceAccountName: rig-reconciler
  sourceRef:
    kind: GitRepository
    name: rig
