# Default-deny egress for every pod in the work namespace.
#
# An empty `podSelector` selects all of them, and `policyTypes: [Egress]` with
# no `egress` rule is how the API spells "no destination is permitted": there is
# no deny verb, only the absence of an allow. DNS is denied along with
# everything else, deliberately — a job pod that cannot resolve a name has one
# fewer way to be told where to go.
#
# Ingress is left unrestricted, so `kubectl exec` and `kubectl logs` keep
# working: both are served by the kubelet into the container rather than by the
# pod opening a connection, so neither is egress and neither is what this
# refuses. That is also what makes the rehearsal in `README.md` possible from
# outside the namespace.
#
# When a job legitimately needs a destination, it is added here as an `egress`
# rule naming that destination, and it is not added by exempting the pod: a
# label that removes a pod from this policy would be a label agent-authored code
# could ask for.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: work-denies-egress
  namespace: chuggy-work
spec:
  podSelector: {}
  policyTypes:
    - Egress
