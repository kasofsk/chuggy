apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: rig
  namespace: chuggy-git
spec:
  interval: 1m
  timeout: 60s
  ref:
    branch: main
  # In-cluster, so the sync read never leaves the pod network and never
  # traverses the ingress that the operator push does.
  url: http://git.chuggy-git.svc.cluster.local./rig.git
  secretRef:
    name: git-sync
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rig
  namespace: chuggy-git
spec:
  interval: 1m
  timeout: 2m
  path: ./deploy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: rig
